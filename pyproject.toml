[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "subgamelab-finite"
version = "0.1.0"
description = "Exact finite sequential multiagent credibility evidence"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
subgamelab = "subgamelab.__main__:main"
[tool.setuptools]
packages = ["subgamelab"]
